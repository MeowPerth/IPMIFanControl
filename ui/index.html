<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPMI 风扇控制</title>
<style>
:root{--bg:#1a1a2e;--bg2:#0f3460;--bg2h:#154080;--accent:#e94560;--accent2:#0ea5e9;--green:#22c55e;--text:#e2e8f0;--muted:#94a3b8;--border:#334155}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
.hdr{background:linear-gradient(135deg,#16213e,var(--bg2));padding:8px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hdr h1{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.hdr-r{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px}
.dot.on{background:var(--green);box-shadow:0 0 5px var(--green)}.dot.off{background:var(--accent)}
.main{padding:12px 16px;max-width:1200px;margin:0 auto}
.sec{font-size:13px;font-weight:600;margin:12px 0 6px;display:flex;align-items:center;gap:5px}
.card{background:var(--bg2);border-radius:8px;padding:10px 12px;border:1px solid var(--border);margin-bottom:8px}
.btn-refresh{padding:3px 10px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--text);cursor:pointer;font-size:12px}
.btn-refresh:disabled{opacity:.5}
/* Mode buttons */
.mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.mode-btn{padding:8px 4px;border:2px solid var(--border);border-radius:6px;background:transparent;color:var(--text);cursor:pointer;text-align:center;transition:.15s;font-size:12px}
.mode-btn:hover{border-color:var(--accent2);background:rgba(14,165,233,.08)}
.mode-btn.on{border-color:var(--accent2);background:rgba(14,165,233,.15)}
.mode-btn .mi{font-size:16px;display:block;margin-bottom:1px}
.mode-btn .ml{font-weight:600;display:block;font-size:11px}
.mode-btn .md{font-size:9px;color:var(--muted);display:block}
/* Custom panel */
.cust{display:none;padding:8px;background:rgba(14,165,233,.05);border-radius:6px;border:1px solid var(--border)}
.cust.show{display:block}
.duty-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.duty-row:last-child{margin-bottom:0}
.duty-lbl{min-width:110px;font-size:11px;font-weight:500}
.duty-slider{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--border);outline:none}
.duty-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent2);cursor:pointer}
.duty-val{min-width:36px;text-align:right;font-weight:600;font-size:12px}
.duty-info{font-size:11px;color:var(--muted);margin-bottom:6px}
/* Two-column layout */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.two-col{grid-template-columns:1fr}}
/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:4px 8px;border-bottom:1px solid var(--border);color:var(--muted);font-weight:500;font-size:10px;text-transform:uppercase}
.tbl td{padding:3px 8px;border-bottom:1px solid rgba(51,65,85,.4);font-size:12px}
.tbl tr:last-child td{border-bottom:none}
.tbl .rpm{font-weight:600;text-align:right}
.tbl .hot{color:var(--accent)}.tbl .warm{color:#eab308}.tbl .cool{color:var(--green)}
.err{background:rgba(233,69,96,.12);border:1px solid var(--accent);border-radius:5px;padding:6px 10px;margin-bottom:8px;display:none;font-size:11px;align-items:center;gap:5px}
.err.show{display:flex}
</style>
</head>
<body>
<div class="hdr">
    <h1>🌀 IPMI 风扇控制</h1>
    <div class="hdr-r">
        <button class="btn-refresh" id="refreshBtn" onclick="fetchAll()">🔄 刷新</button>
        <span id="statusIndicator"><span class="dot off"></span> 未连接</span>
        <span id="lastUpdate">--</span>
    </div>
</div>
<div class="main">
    <div class="err" id="errorBanner"><span>⚠️</span><span id="errorMsg"></span></div>

    <!-- Fan Mode -->
    <div class="sec">⚙️ 风扇模式</div>
    <div class="card">
        <div class="mode-grid">
            <button class="mode-btn" id="mode-optimal" onclick="setMode('optimal')"><span class="mi">🌙</span><span class="ml">静音</span><span class="md">Optimal</span></button>
            <button class="mode-btn" id="mode-standard" onclick="setMode('standard')"><span class="mi">⚡</span><span class="ml">标准</span><span class="md">Standard</span></button>
            <button class="mode-btn" id="mode-full_speed" onclick="setMode('full_speed')"><span class="mi">🔥</span><span class="ml">全速</span><span class="md">Full Speed</span></button>
            <button class="mode-btn" id="mode-heavy_io" onclick="setMode('heavy_io')"><span class="mi">💨</span><span class="ml">重IO</span><span class="md">Heavy I/O</span></button>
        </div>
        <div id="customPanel" class="cust">
            <div class="duty-info">💡 自定义转速需在全速（Full Speed）模式下设置</div>
            <div class="duty-row"><span class="duty-lbl">🔧 Zone 0 (CPU/系统)</span><input type="range" class="duty-slider" id="duty0" min="0" max="100" value="50" oninput="updDuty(0)"><span class="duty-val" id="duty0Val">50%</span></div>
            <div class="duty-row"><span class="duty-lbl">🔧 Zone 1 (机箱/存储)</span><input type="range" class="duty-slider" id="duty1" min="0" max="100" value="50" oninput="updDuty(1)"><span class="duty-val" id="duty1Val">50%</span></div>
            <div style="text-align:right;margin-top:4px"><button onclick="applyDuty()" style="padding:5px 14px;border:none;border-radius:4px;background:var(--accent2);color:#fff;font-weight:600;cursor:pointer;font-size:12px">应用转速</button></div>
        </div>
    </div>

    <!-- Fans + Temperatures side by side -->
    <div class="two-col">
        <div>
            <div class="sec">🌀 风扇详情</div>
            <div class="card" style="padding:4px 0">
                <table class="tbl">
                    <thead><tr><th>名称</th><th style="text-align:right">转速</th></tr></thead>
                    <tbody id="fanBody"><tr><td colspan="2" style="text-align:center;color:var(--muted)">加载中...</td></tr></tbody>
                </table>
            </div>
        </div>
        <div>
            <div class="sec">🌡️ 温度</div>
            <div class="card" style="padding:4px 0">
                <table class="tbl">
                    <thead><tr><th>传感器</th><th style="text-align:right">温度</th></tr></thead>
                    <tbody id="tempBody"><tr><td colspan="2" style="text-align:center;color:var(--muted)">加载中...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
var API_BASE = '/webman/3rdparty/IPMIFanControl/api.cgi';
function apiUrl(a) { return API_BASE + '?action=' + encodeURIComponent(a); }
var loading = false;

function fetchAll() {
    if (loading) return;
    loading = true;
    var btn = document.getElementById('refreshBtn');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ 读取中...'; }
    var ctrl = new AbortController();
    var timer = setTimeout(function() { ctrl.abort(); }, 10000);
    fetch(apiUrl('all'), { signal: ctrl.signal })
        .then(function(r) { clearTimeout(timer); if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function(raw) { updateUI(parseAll(raw)); setStatus(true); })
        .catch(function(e) { if (e.name !== 'AbortError') setStatus(false, e.message); })
        .finally(function() { loading = false; if (btn) { btn.disabled = false; btn.textContent = '🔄 刷新'; } });
}

function parseAll(text) {
    var r = { fan_mode: null, duties: [0, 0], fans: [], temps: [] };

    // Split by markers — find ===XXX=== lines and split content between them
    var markers = ['FAN_MODE', 'DUTY_0', 'DUTY_1', 'FAN_SDR', 'TEMP_SDR'];
    var clean = text.replace(/\r/g, '');
    var sec = {};
    for (var i = 0; i < markers.length; i++) {
        var tag = '===' + markers[i] + '===';
        var start = clean.indexOf(tag);
        if (start === -1) { sec[markers[i]] = ''; continue; }
        start += tag.length;
        // Skip the newline right after the marker
        if (clean.charAt(start) === '\n') start++;
        // Find the next marker or end of string
        var end = clean.length;
        for (var j = 0; j < markers.length; j++) {
            if (j === i) continue;
            var nextTag = '===' + markers[j] + '===';
            var pos = clean.indexOf(nextTag, start);
            if (pos !== -1 && pos < end) end = pos;
        }
        sec[markers[i]] = clean.substring(start, end).replace(/^\n/, '').replace(/\n$/, '');
    }

    // Fan mode
    var mv = (sec.FAN_MODE || '').replace(/\s/g, '');
    var mm = { '00': ['standard','标准（Standard）'], '01': ['full_speed','全速（Full Speed）'], '02': ['optimal','静音（Optimal）'], '04': ['heavy_io','重IO（Heavy I/O）'] };
    r.fan_mode = mm[mv] ? { id: mm[mv][0], name: mm[mv][1] } : { id: 'standard', name: '标准（Standard）' };

    // Duty (hex)
    r.duties[0] = parseInt((sec.DUTY_0 || '0').replace(/\s/g, ''), 16) || 0;
    r.duties[1] = parseInt((sec.DUTY_1 || '0').replace(/\s/g, ''), 16) || 0;

    // Fans
    (sec.FAN_SDR || '').split('\n').forEach(function(line) {
        var cols = line.split('|');
        if (cols.length < 5) return;
        var name = cols[0].trim();
        var reading = cols[4].trim();
        var rpm = reading.match(/(\d+)/);
        r.fans.push({ name: name, rpm: rpm ? parseInt(rpm[1]) : null });
    });

    // Temperatures
    (sec.TEMP_SDR || '').split('\n').forEach(function(line) {
        var cols = line.split('|');
        if (cols.length < 5) return;
        var name = cols[0].trim();
        var reading = cols[4].trim();
        var val = reading.match(/(\d+)/);
        if (val && parseInt(val[1]) > 0) {
            r.temps.push({ name: name, value: parseInt(val[1]) });
        }
    });

    return r;
}

function setStatus(ok, msg) {
    document.getElementById('statusIndicator').innerHTML = ok
        ? '<span class="dot on"></span> 已连接'
        : '<span class="dot off"></span> ' + (msg || '未连接');
    ok ? hideError() : (msg ? showError(msg) : 0);
}
function showError(m) { document.getElementById('errorMsg').textContent = m; document.getElementById('errorBanner').classList.add('show'); }
function hideError() { document.getElementById('errorBanner').classList.remove('show'); }

function updateUI(d) {
    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('zh-CN');

    // Update sliders
    for (var i = 0; i < 2; i++) {
        var s = document.getElementById('duty' + i);
        var l = document.getElementById('duty' + i + 'Val');
        if (s) { s.value = d.duties[i]; }
        if (l) { l.textContent = d.duties[i] + '%'; }
    }

    updateModeUI(d.fan_mode);

    // Fan table
    var fb = document.getElementById('fanBody');
    if (d.fans.length) {
        fb.innerHTML = d.fans.map(function(f) {
            var rpmText = f.rpm !== null ? f.rpm + ' RPM' : 'no reading';
            var cls = f.rpm !== null ? '' : 'color:var(--muted)';
            return '<tr><td>' + esc(f.name) + '</td><td class="rpm" style="' + cls + '">' + rpmText + '</td></tr>';
        }).join('');
    } else {
        fb.innerHTML = '<tr><td colspan="2" style="text-align:center;color:var(--muted)">未检测到风扇</td></tr>';
    }

    // Temperature table
    var tb = document.getElementById('tempBody');
    if (d.temps.length) {
        tb.innerHTML = d.temps.map(function(t) {
            var cls = t.value >= 70 ? 'hot' : t.value >= 50 ? 'warm' : 'cool';
            return '<tr><td>' + esc(t.name) + '</td><td class="rpm ' + cls + '">' + t.value + ' °C</td></tr>';
        }).join('');
    } else {
        tb.innerHTML = '<tr><td colspan="2" style="text-align:center;color:var(--muted)">未检测到温度</td></tr>';
    }
}

function updateModeUI(mode) {
    ['optimal','standard','full_speed','heavy_io'].forEach(function(m) {
        var b = document.getElementById('mode-' + m);
        if (b) b.classList.remove('on');
    });
    document.getElementById('customPanel').classList.remove('show');
    var b = document.getElementById('mode-' + mode.id);
    if (b) b.classList.add('on');
    if (mode.id === 'full_speed') document.getElementById('customPanel').classList.add('show');
}

function setMode(mode) {
    fetch(apiUrl('fan_mode'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: mode }) })
        .then(function() { setTimeout(fetchAll, 500); })
        .catch(function(e) { showError('设置模式失败: ' + e.message); });
}

function updDuty(z) {
    var s = document.getElementById('duty' + z);
    var l = document.getElementById('duty' + z + 'Val');
    if (s && l) l.textContent = s.value + '%';
}

function applyDuty() {
    var d0 = document.getElementById('duty0').value;
    var d1 = document.getElementById('duty1').value;
    fetch(apiUrl('duty') + '&zone=0', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ percent: parseInt(d0) }) })
        .then(function() { return fetch(apiUrl('duty') + '&zone=1', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ percent: parseInt(d1) }) }); })
        .then(function() { setTimeout(fetchAll, 500); })
        .catch(function(e) { showError('设置转速失败: ' + e.message); });
}

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
document.addEventListener('DOMContentLoaded', fetchAll);
</script>
</body>
</html>
